<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stack Master - Setup Required</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1b;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }
        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
        }
        h1 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        .token-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin: 20px 0;
            text-align: center;
        }
        .token-input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            display: none;
        }
        .info {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/logo.png" alt="AI Stack Master" class="logo">
        <h1>AI Stack Master</h1>
        <p>Initial Setup Required</p>
        
        <input type="password" 
               id="token" 
               class="token-input" 
               placeholder="Enter setup token"
               onkeypress="if(event.key === 'Enter') startSetup()">
        
        <button class="button" onclick="startSetup()">Start Setup</button>
        
        <div id="error" class="error"></div>
        
        <div class="info">
            The setup token can be found in the server console logs
        </div>
    </div>

    <script>
        function startSetup() {
            const token = document.getElementById('token').value;
            const errorDiv = document.getElementById('error');
            
            if (!token) {
                errorDiv.textContent = 'Please enter a setup token';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Validate token format (64 hex characters for 32 bytes)
            if (!/^[a-f0-9]{64}$/.test(token)) {
                errorDiv.textContent = 'Invalid token format (must be 64 characters)';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Redirect with token
            window.location.href = `/?token=${token}`;
        }
        
        // Check if already authenticated
        fetch('/api/health', { credentials: 'include' })
            .then(res => {
                if (res.ok) {
                    // Already authenticated, redirect to main UI
                    window.location.href = '/';
                }
            });
    </script>
</body>
</html>
