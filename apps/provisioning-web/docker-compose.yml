version: '3.8'

services:
  provisioning-wizard:
    build: .
    container_name: stack-masters-wizard
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - PROJECT_ROOT=${PROJECT_ROOT:-/project}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${CLONE_DIR:-./project}:/project:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s